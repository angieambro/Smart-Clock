[platformio]
src_dir = .

[env:due]
platform = atmelsam
board = due
framework = arduino
build_src_filter =
  +<src/main.cpp>
  +<03_faith_tft_ui/*.cpp>
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
