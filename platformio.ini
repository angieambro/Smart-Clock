[platformio]
src_dir = .

[env:due]
platform = atmelsam
board = due
framework = arduino
build_src_filter =
  +<src/main.cpp>
  +<01_angie_feng_master_core/*.cpp>
monitor_speed = 115200
lib_deps =
  adafruit/RTClib
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  arduino-libraries/Servo@^1.2.2